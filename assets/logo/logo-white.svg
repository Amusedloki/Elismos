<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#009FE3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#087EBA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9BEF00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7ACC00;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#blueGradient)"/>
  
  <!-- Lower half - green -->
  <path d="M 100 100 L 5 100 A 95 95 0 0 0 195 100 Z" fill="url(#greenGradient)"/>
  
  <!-- White banner across center -->
  <rect x="10" y="85" width="180" height="30" fill="white" rx="2"/>
  
  <!-- ELISMOS text -->
  <text x="100" y="106" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1A1A2E" text-anchor="middle" letter-spacing="2">ELISMOS</text>
  
  <!-- Subtle inner ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
</svg>