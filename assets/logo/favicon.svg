<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#009FE3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#087EBA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9BEF00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7ACC00;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main Circle -->
  <circle cx="16" cy="16" r="15" fill="url(#blueGradient)"/>
  
  <!-- Lower half - green -->
  <path d="M 16 16 L 1 16 A 15 15 0 0 0 31 16 Z" fill="url(#greenGradient)"/>
  
  <!-- White banner across center -->
  <rect x="2" y="13" width="28" height="6" fill="white" rx="1"/>
  
  <!-- E letter -->
  <text x="16" y="18.5" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="bold" fill="#1A1A2E" text-anchor="middle">E</text>
</svg>